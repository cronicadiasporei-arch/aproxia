name: flutter_hbb
description: Your Remote Desktop Software

# The following line prevents the package from being accidentally published to
# pub.dev using `pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# Aproxia follows its own SemVer lifecycle; upstream component versions are tracked separately.
version: 1.0.1+101

environment:
  sdk: '^3.1.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  ffi: ^2.1.0
  path_provider: ^2.1.1
  provider: ^6.0.5
  tuple: ^2.0.0
  wakelock_plus: ^1.1.3
  package_info_plus: ^4.2.0
  url_launcher: ^6.3.1
  url_launcher_ios: ^6.3.2
  toggle_switch: ^2.1.0
  dash_chat_2:
    git:
      url: https://github.com/rustdesk-org/Dash-Chat-2
      ref: bd6b5b41254e57c5bcece202ebfb234de63e6487
  draggable_float_widget: ^0.1.0
  settings_ui: ^2.0.2
  flutter_breadcrumb: ^1.0.1
  http: ^1.1.0
  qr_code_scanner: ^1.0.0
  zxing2: ^0.2.0
  image_picker: ^1.1.2
  image: ^4.0.17
  back_button_interceptor: ^6.0.1
  flutter_rust_bridge: "1.80.1"
  window_manager:
    git:
      url: https://github.com/rustdesk-org/window_manager
      ref: cf4aef0512092fad9344a27ffe1c47ad83269dfc
  desktop_multi_window:
    git:
      url: https://github.com/rustdesk-org/rustdesk_desktop_multi_window
      ref: 8b774a66671cbb9bcb2631af6ac28f9bdd469ce3
  freezed_annotation: ^2.0.3
  flutter_custom_cursor:
    git:
      url: https://github.com/rustdesk-org/flutter_custom_cursor
      ref: db63b785c38153603e9fb84b50d3ec46f0d7e05e
  window_size:
    git:
      url: https://github.com/21pages/flutter-desktop-embedding.git
      path: plugins/window_size
  desktop_drop: ^0.4.4
  freezed: ^2.3.2
  flutter_svg: ^2.0.9
  flutter_improved_scrolling: ^0.0.3
  bot_toast: ^4.0.3
  get: ^4.6.5
  http_parser: ^4.0.2
  socket_io_client: ^3.0.2
  google_fonts: ^6.1.0
  flutter_secure_storage: ^9.2.4
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  json_annotation: ^4.9.0
  uuid: ^4.5.1
  collection: ^1.18.0
  flutter_hooks: ^0.20.5
  hooks_riverpod: ^2.6.1
  url_strategy: ^0.3.0
  flutter_markdown: ^0.7.4+3
  flutter_typeahead: ^5.2.0
  file_picker: ^8.1.2
  dotted_border: ^2.1.0
  flutter_parsed_text: ^2.2.1
  flutter_math_fork: ^0.7.2
  flex_color_picker: ^3.5.1
  flutter_colorpicker: ^1.1.0
  wakelock: ^0.6.2
  flutter_keyboard_visibility: ^6.0.0
  web_socket_channel: ^3.0.1
  webview_windows: ^0.4.0
  visibility_detector: ^0.4.0+2
  flutter_webrtc: ^0.12.3
  flutter_launcher_icons: ^0.14.1
  shared_preferences: ^2.3.2
  device_info_plus: ^10.1.2
  uni_links: ^0.5.1
  flutter_native_splash: ^2.4.1
  package_info: ^2.0.2
  tray_manager: ^0.2.4
  flutter_multi_formatter: ^2.13.0
  debounce_throttle: ^2.0.0
  flutter_smart_dialog: ^4.9.8+5
  flutter_spinkit: ^5.2.1
  flutter_html: ^3.0.0-beta.2
  flutter_inappwebview: ^6.1.5
  flutter_cache_manager: ^3.4.1
  cached_network_image: ^3.4.1
  flutter_local_notifications: ^18.0.1
  permission_handler: ^11.3.1
  intl: ^0.19.0
  path: ^1.9.0
  archive: ^3.6.1
  crypto: ^3.0.5
  characters: ^1.3.0
  desktop_lifecycle: ^0.1.0
  flutter_acrylic: ^1.1.4
  flutter_window_close: ^1.2.0
  screen_retriever: ^0.1.9
  contextmenu: ^3.0.0
  multi_split_view: ^3.6.0
  scroll_pos: ^0.5.0
  easy_debounce: ^2.0.3
  flutter_tabler_icons: ^1.43.0
  dynamic_color: ^1.7.0
  window_manager_plus: ^1.0.5

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "../res/icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  macos:
    image_path: "../res/mac-icon.png"
    generate: true
  linux: true
  web:
    generate: true

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/aproxia/

  fonts:
    - family: GestureIcons
      fonts:
        - asset: assets/gestures.ttf
    - family: Tabbar
      fonts:
        - asset: assets/tabbar.ttf
    - family: PeerSearchbar
      fonts:
        - asset: assets/peer_searchbar.ttf
    - family: AddressBook
      fonts:
        - asset: assets/address_book.ttf
    - family: DeviceGroup
      fonts:
        - asset: assets/device_group.ttf
    - family: More
      fonts:
        - asset: assets/more.ttf
