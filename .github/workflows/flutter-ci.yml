name: Aproxia Full Build (manual only)

on:
  workflow_dispatch:

# Keep the upstream full multi-platform build available for manual testing,
# but do not run it on every Aproxia commit.
permissions:
  contents: write

jobs:
  run-ci:
    uses: ./.github/workflows/flutter-build.yml
    permissions:
      contents: write
    with:
      upload-artifact: true
      upload-tag: "aproxia-v1-preview"
