name: Aproxia Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - aproxia-v1
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "res/**"
      - "appimage/**"
      - "flatpak/**"

# The upstream reusable build publishes SBOM/release artifacts and therefore
# requests write access to repository contents. GitHub requires the caller to
# grant at least the same permission level.
permissions:
  contents: write

jobs:
  run-ci:
    uses: ./.github/workflows/flutter-build.yml
    permissions:
      contents: write
    with:
      upload-artifact: true
      upload-tag: "aproxia-v1-preview"
