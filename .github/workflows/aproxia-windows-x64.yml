name: Aproxia Windows x64 Preview

on:
  workflow_dispatch:
  push:
    branches:
      - aproxia-v1
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "res/**"
      - "appimage/**"
      - "flatpak/**"

permissions:
  contents: read

env:
  SCITER_RUST_VERSION: "1.75"
  FLUTTER_VERSION: "3.24.5"
  LLVM_VERSION: "15.0.6"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-topmost-window:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10

  windows-x64:
    name: x86_64-pc-windows-msvc
    needs: [generate-bridge, build-topmost-window]
    runs-on: windows-2022

    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Replace engine with RustDesk custom Flutter engine
        shell: powershell
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          Move-Item -Force windows-x64-release/* "C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/"

      - name: Patch Flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Flutter preflight
        shell: powershell
        run: |
          Push-Location flutter
          flutter pub get
          flutter analyze --no-fatal-warnings --no-fatal-infos lib/desktop/pages/connection_page.dart lib/desktop/pages/desktop_home_page.dart lib/aproxia_brand.dart
          Pop-Location

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          prefix-key: windows-2022-aproxia-x64

      - name: Setup vcpkg with GitHub Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        shell: bash
        run: |
          if ! $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r log; do
              echo "===== $log ====="
              cat "$log"
            done
            exit 1
          fi

      - name: Build Aproxia Windows x64
        shell: powershell
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec --vram
          Move-Item ./flutter/build/windows/x64/runner/Release ./aproxia-windows-x64

      - name: Add remote-control helper files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: topmostwindow-artifacts-x64
          path: ./aproxia-windows-x64

      - name: Build single-file Aproxia Portable
        shell: powershell
        run: |
          python -m pip install -r .\libs\portable\requirements.txt
          python .\libs\portable\generate.py -f .\aproxia-windows-x64 -o .\libs\portable -e aproxia.exe -t x86_64-pc-windows-msvc
          $packer = ".\target\x86_64-pc-windows-msvc\release\rustdesk-portable-packer.exe"
          if (!(Test-Path $packer)) {
            Write-Host "Portable packer was not found at expected workspace target path: $packer"
            Get-ChildItem -Path . -Filter rustdesk-portable-packer.exe -Recurse | ForEach-Object { Write-Host "Found candidate: $($_.FullName)" }
            throw "Portable packer executable not found"
          }
          Copy-Item $packer .\Aproxia-Portable-x64.exe
          $hash = (Get-FileHash .\Aproxia-Portable-x64.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Aproxia-Portable-x64.exe" | Out-File -Encoding ascii .\Aproxia-Portable-x64.sha256
          Write-Host "Aproxia Portable SHA-256: $hash"

      - name: Upload Aproxia Windows folder artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: aproxia-windows-x64-preview
          path: ./aproxia-windows-x64
          if-no-files-found: error

      - name: Upload Aproxia single-file portable artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: aproxia-portable-x64-preview
          path: |
            ./Aproxia-Portable-x64.exe
            ./Aproxia-Portable-x64.sha256
          if-no-files-found: error
